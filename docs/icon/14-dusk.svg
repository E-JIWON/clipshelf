<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1"><stop offset="0" stop-color="#2b2a4a"/><stop offset=".55" stop-color="#4a3a63"/><stop offset="1" stop-color="#8a5a63"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".20"/><stop offset="1" stop-color="#fff" stop-opacity=".10"/></linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f1c7a3"/><stop offset="1" stop-color="#d98a7a"/></linearGradient>
    <clipPath id="c"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/></filter><filter id="shs" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".22"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <!-- soft light bloom top-right so the glass has something to refract -->
    <circle cx="780" cy="220" r="260" fill="#ffd6b8" opacity=".18"/>
    <g filter="url(#sh)">
      <rect x="-60" y="212" width="470" height="600" rx="64" fill="url(#glass)"/>
    </g>
    <rect x="-60" y="212" width="470" height="600" rx="64" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2"/>
    <rect x="120" y="262" width="240" height="156" rx="22" fill="url(#photo)" filter="url(#shs)"/>
    <circle cx="164" cy="304" r="12" fill="#fff" opacity=".9"/>
    <path d="M120 400 L190 332 L238 380 L262 356 L360 418 L120 418Z" fill="#fff" opacity=".3"/>
    <rect x="120" y="442" width="240" height="112" rx="22" fill="#fff" fill-opacity=".14"/>
    <rect x="146" y="474" width="150" height="10" rx="5" fill="#fff" opacity=".6"/>
    <rect x="146" y="500" width="108" height="10" rx="5" fill="#fff" opacity=".6"/>
    <rect x="120" y="578" width="240" height="112" rx="22" fill="#fff" fill-opacity=".08"/>
  </g>
</svg>

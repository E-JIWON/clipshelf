<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a3350"/><stop offset="1" stop-color="#151a2e"/></linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb36b"/><stop offset="1" stop-color="#ff6f61"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3e6d3"/><stop offset="1" stop-color="#d9c3a3"/></linearGradient>
    <clipPath id="c"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <!-- leaning photo frame -->
    <g transform="rotate(-6 390 520)">
      <rect x="270" y="400" width="240" height="240" rx="24" fill="#fff"/>
      <rect x="292" y="422" width="196" height="196" rx="14" fill="url(#photo)"/>
      <circle cx="340" cy="470" r="20" fill="#fff" opacity=".9"/>
      <path d="M292 600 L360 528 L410 578 L440 548 L488 598 L488 618 L292 618Z" fill="#fff" opacity=".4"/>
    </g>
    <!-- stacked notes -->
    <rect x="556" y="560" width="210" height="34" rx="10" fill="#ffffff" opacity=".55"/>
    <rect x="548" y="596" width="226" height="34" rx="10" fill="#ffffff" opacity=".75"/>
    <rect x="540" y="632" width="242" height="34" rx="10" fill="#ffffff" opacity=".95"/>
    <!-- shelf plank + shadow -->
    <ellipse cx="512" cy="672" rx="270" ry="16" fill="#000" opacity=".5"/>
    <rect x="220" y="664" width="584" height="40" rx="12" fill="url(#wood)"/>
    <rect x="220" y="700" width="584" height="12" rx="6" fill="#000" opacity=".25"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2c3340"/><stop offset="1" stop-color="#11141a"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity=".10"/></linearGradient>
    <linearGradient id="photo" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8b08a"/><stop offset="1" stop-color="#c46e5a"/></linearGradient>
    <clipPath id="c"><rect x="100" y="100" width="824" height="824" rx="184"/></clipPath><filter id="sh" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".35"/></filter><filter id="shs" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".22"/></filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="184" fill="url(#bg)"/>
  <g clip-path="url(#c)">
    <!-- hidden state: only the tab shows, with cards sliced off at the edge -->
    <g filter="url(#sh)">
      <rect x="-300" y="236" width="500" height="552" rx="64" fill="url(#glass)"/>
    </g>
    <rect x="-300" y="236" width="500" height="552" rx="64" fill="none" stroke="#fff" stroke-opacity=".28" stroke-width="2"/>
    <rect x="-100" y="292" width="250" height="150" rx="22" fill="url(#photo)"/>
    <rect x="-100" y="468" width="250" height="100" rx="22" fill="#fff" fill-opacity=".14"/>
    <rect x="-100" y="594" width="250" height="100" rx="22" fill="#fff" fill-opacity=".08"/>
    <!-- subtle cursor-ish hint: a soft glow at the tab -->
    <ellipse cx="200" cy="512" rx="40" ry="260" fill="#fff" opacity=".05"/>
  </g>
</svg>
